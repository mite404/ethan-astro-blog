name: CI

# Do NOT add `status:` or `check_suite:` triggers here. This workflow posts its own
# check/status results, so those events re-trigger it — a self-sustaining loop that
# accounted for 75% of all CI runs before it was removed (63 `status` + 12 `check_suite`
# out of 100). The `auto-merge` job already waits on external checks explicitly.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  validate:
    name: Validate Code & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Removed two `if [ -f "bun.lockb" ]` guarded steps here. Bun 1.1.39 renamed the
      # lockfile to the text-based `bun.lock`, so both guards were always false — the
      # steps printed "not configured, skipping" on every run and never checked anything.
      # ESLint is covered by `bun run lint` below. Formatting is NOT yet enforced:
      # `prettier --check` currently fails on pre-existing files, so wire it up only
      # after those are cleaned.

      - name: Run linting
        run: bun run lint

      - name: Build project
        run: bun run build

  auto-merge:
    name: Auto Merge
    runs-on: ubuntu-latest
    needs: validate
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      (
        github.actor == 'dependabot[bot]' ||
        contains(github.event.pull_request.labels.*.name, 'automerge')
      )

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto approve Dependabot PRs
        if: github.actor == 'dependabot[bot]'
        uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}

      - name: Wait for all checks to complete
        uses: fountainhead/action-wait-for-check@v1.2.0
        id: wait-for-checks
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          checkName: 'Validate Code & Build'
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          timeoutSeconds: 600
          intervalSeconds: 10

      - name: Auto merge
        if: steps.wait-for-checks.outputs.conclusion == 'success'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              merge_method: 'squash',
              commit_title: pullRequest.title,
              commit_message: pullRequest.body || ''
            });
